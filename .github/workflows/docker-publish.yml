# Build the Colyseus server image and publish it to GHCR — GitHub's own
# container registry. Authentication uses the built-in GITHUB_TOKEN, so
# there is NO personal access token to configure: the `packages: write`
# permission below is everything the push needs.
#
# Image: ghcr.io/janeirohurley/server-games
#   - `develop`     — latest build of this branch
#   - `sha-<short>` — the exact commit (immutable pin for compose)
#   - `<semver>`    — when a `v*` tag is pushed
#
# NOTE (public visibility): the first push creates the package as PRIVATE.
# For a Docker host to pull it without credentials, flip it to public under
# the repo's Packages settings, or `docker login ghcr.io` on that host.
#
# No build args: the Colyseus server takes all its configuration at RUNTIME
# (PORT, REALTIME_TOKEN_SECRET injected by compose).

name: docker-publish

on:
  push:
    branches: [develop]
    tags: ["v*"]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
