# Build the Colyseus server image and publish it to GHCR — GitHub's own
# container registry. Authentication uses the built-in GITHUB_TOKEN, so
# there is NO personal access token to configure: the `packages: write`
# permission below is everything the push needs.
#
# VERSIONING — the code version in package.json is the source of truth:
#   - push to develop      → images `develop` + `sha-<short>` (dev channel)
#   - push tag `vX.Y.Z`    → images `X.Y.Z` + `X.Y` + `latest`
#   The workflow REFUSES a tag that does not match package.json, so a
#   published image version always names the code it was built from.
#
# Image: ghcr.io/janeirohurley/server-games
#
# NOTE (public visibility): the first push creates the package as PRIVATE.
# For a Docker host to pull it without credentials, flip it to public under
# the repo's Packages settings, or `docker login ghcr.io` on that host.
#
# No build args: the Colyseus server takes all its configuration at RUNTIME
# (PORT, REALTIME_TOKEN_SECRET injected by compose).

name: docker-publish

on:
  push:
    branches: [develop]
    tags: ["v*"]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(jq -r .version package.json)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version v${version}"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
          flavor: |
            latest=auto

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
